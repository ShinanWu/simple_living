apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: simple-living
type: Opaque
stringData:
  # Template only.
  # Never commit real credentials/tokens/keys to git.
  POSTGRES_DSN: "postgres://<user>:<password>@<host>:5432/<db>?sslmode=disable"
  REDIS_PASSWORD: "<replace-me>"
  JWT_SIGNING_KEY: "<replace-me>"
  AFFILIATE_PARTNER_API_KEY: "<replace-me>"

syntax = "proto2";

package simple_living.tracking_domain;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/simple_living/services/tracking-domain/proto;trackingpb";

// Internal gRPC API for tracking-domain.
// Human-maintained contract: services/tracking-domain/docs/api.md

// --- Enums ---

enum TrackingLinkStatus {
  TRACKING_LINK_STATUS_UNSPECIFIED = 0;
  TRACKING_LINK_STATUS_ACTIVE = 1;
  TRACKING_LINK_STATUS_EXPIRED = 2;
  TRACKING_LINK_STATUS_REVOKED = 3;
}

enum RedirectDisposition {
  REDIRECT_DISPOSITION_UNSPECIFIED = 0;
  REDIRECT_DISPOSITION_HTTP_302 = 1;
  REDIRECT_DISPOSITION_JSON_BODY = 2;
  REDIRECT_DISPOSITION_GONE = 3;
}

enum RedirectRequestFormat {
  REDIRECT_REQUEST_FORMAT_UNSPECIFIED = 0;
  REDIRECT_REQUEST_FORMAT_REDIRECT = 1;
  REDIRECT_REQUEST_FORMAT_JSON = 2;
}

enum ConversionSource {
  CONVERSION_SOURCE_UNSPECIFIED = 0;
  CONVERSION_SOURCE_PARTNER_POSTBACK = 1;
  CONVERSION_SOURCE_AFFILIATE_DOMAIN = 2;
  CONVERSION_SOURCE_MANUAL_ADJUSTMENT = 3;
}

enum ConversionType {
  CONVERSION_TYPE_UNSPECIFIED = 0;
  CONVERSION_TYPE_ORDER_PAID = 1;
  CONVERSION_TYPE_LEAD = 2;
  CONVERSION_TYPE_INSTALL = 3;
}

enum ConversionIngestStatus {
  CONVERSION_INGEST_STATUS_UNSPECIFIED = 0;
  CONVERSION_INGEST_STATUS_ACCEPTED = 1;
  CONVERSION_INGEST_STATUS_DUPLICATE = 2;
  CONVERSION_INGEST_STATUS_UNMATCHED = 3;
}

enum MatchConfidence {
  MATCH_CONFIDENCE_UNSPECIFIED = 0;
  MATCH_CONFIDENCE_EXACT = 1;
  MATCH_CONFIDENCE_INFERRED = 2;
  MATCH_CONFIDENCE_UNMATCHED = 3;
}

enum CommissionSummaryGranularity {
  COMMISSION_SUMMARY_GRANULARITY_UNSPECIFIED = 0;
  COMMISSION_SUMMARY_GRANULARITY_DAY = 1;
  COMMISSION_SUMMARY_GRANULARITY_WEEK = 2;
}

enum TrackingErrorCode {
  TRACKING_ERROR_CODE_UNSPECIFIED = 0;
  TRACKING_ERROR_CODE_INVALID_TOKEN = 1;
  TRACKING_ERROR_CODE_LINK_EXPIRED = 2;
  TRACKING_ERROR_CODE_AFFILIATE_CONTEXT_INVALID = 3;
  TRACKING_ERROR_CODE_AFFILIATE_SPEC_FAILED = 4;
  TRACKING_ERROR_CODE_RATE_LIMITED = 5;
  TRACKING_ERROR_CODE_DUPLICATE_CONVERSION = 6;
}

// --- Shared messages ---

message ContentRef {
  optional string content_id = 1;
  optional string guide_card_id = 2;
  optional string recommendation_id = 3;
  optional string scene = 4;
  optional int32 item_rank = 5;
}

message DeviceContext {
  optional string client_platform = 1;
  optional string app_version = 2;
  optional string webview_user_agent = 3;
}

message RedirectHint {
  optional string app_scheme = 1;
  optional string universal_link = 2;
  optional string mini_program_path = 3;
}

message AttributionPayload {
  optional string click_id = 1;
  optional string link_ref = 2;
  optional string content_id = 3;
  optional string guide_card_id = 4;
  optional string placement = 5;
  optional string channel_code = 6;
  optional string recommendation_id = 7;
  optional string scene = 8;
  optional int32 item_rank = 9;
  optional string campaign_slot = 10;
  optional string sub_id_1 = 11;
  optional string sub_id_2 = 12;
  optional string sub_id_3 = 13;
}

message MoneyMinor {
  optional string currency = 1;
  optional int64 value_minor = 2;
}

message CommissionMinor {
  optional string currency = 1;
  optional int64 value_minor = 2;
  optional bool estimate = 3;
}

message CursorPagination {
  optional string cursor = 1;
  optional int32 limit = 2;
}

message PaginationMeta {
  optional string next_cursor = 1;
  optional bool has_more = 2;
}

message TrackingErrorDetail {
  optional TrackingErrorCode code = 1;
  optional string link_ref = 2;
  optional bool retryable = 3;
}

// --- Assemble link ---

message AssembleTrackingLinkRequest {
  optional ContentRef content_ref = 1;
  optional string placement = 2;
  optional string affiliate_context_ref = 3;
  optional DeviceContext device_context = 4;
  optional string idempotency_key = 5;
  optional string user_id = 6;
  optional string device_id = 7;
}

message AssembleTrackingLinkResponse {
  optional string landing_url = 1;
  optional google.protobuf.Timestamp expires_at = 2;
  optional RedirectHint redirect_hint = 3;
  optional AttributionPayload attribution_echo = 4;
  optional string link_ref = 5;
  optional string short_token = 6;
}

// --- Redirect ---

message ResolveRedirectRequest {
  optional string short_token = 1;
  optional bytes signed_blob = 2;
  optional RedirectRequestFormat request_format = 3;
  optional string client_ip_hash = 4;
  optional string user_agent = 5;
  optional string device_dedup_key = 6;
}

message ResolveRedirectJsonBody {
  optional string landing_url = 1;
  optional string partner_url = 2;
  optional string click_id = 3;
}

message ResolveRedirectResponse {
  optional RedirectDisposition disposition = 1;
  optional string http_location = 2;
  optional string click_id = 3;
  optional string redirect_state = 4;
  optional ResolveRedirectJsonBody json_body = 5;
}

// --- Ack click ---

message AckClickRequest {
  oneof link_selector {
    string link_ref = 1;
    string short_token = 2;
  }
  optional google.protobuf.Timestamp opened_at = 3;
  optional string idempotency_key = 4;
}

message AckClickResponse {
  optional string click_id = 1;
}

// --- Conversion ---

message IngestConversionRequest {
  optional ConversionSource source = 1;
  optional string external_event_id = 2;
  optional google.protobuf.Timestamp occurred_at = 3;
  optional string click_id = 4;
  optional AttributionPayload attribution = 5;
  optional ConversionType conversion_type = 6;
  optional MoneyMinor amount = 7;
  optional CommissionMinor commission = 8;
  optional string raw_payload_ref = 9;
}

message IngestConversionResponse {
  optional string conversion_id = 1;
  optional string matched_click_id = 2;
  optional ConversionIngestStatus status = 3;
  optional MatchConfidence match_confidence = 4;
}

// --- Commission views ---

message GetCommissionSummaryRequest {
  optional google.protobuf.Timestamp from_time = 1;
  optional google.protobuf.Timestamp to_time = 2;
  optional CommissionSummaryGranularity granularity = 3;
  optional ContentRef content_ref = 4;
  optional string user_id = 5;
}

message CommissionSummaryBucket {
  optional google.protobuf.Timestamp bucket_start = 1;
  optional int64 estimated_minor = 2;
  optional int64 reported_minor = 3;
  optional string currency = 4;
  optional int32 order_count = 5;
}

message GetCommissionSummaryResponse {
  repeated CommissionSummaryBucket buckets = 1;
}

message ListCommissionItemsRequest {
  optional CursorPagination pagination = 1;
  optional string user_id = 2;
  optional string conversion_id = 3;
  optional string click_id = 4;
}

message CommissionLineItem {
  optional string conversion_id = 1;
  optional string click_id = 2;
  optional google.protobuf.Timestamp occurred_at = 3;
  optional int64 commission_minor = 4;
  optional string currency = 5;
  optional ConversionType conversion_type = 6;
}

message ListCommissionItemsResponse {
  repeated CommissionLineItem items = 1;
  optional PaginationMeta pagination = 2;
}

// --- Services ---

service TrackingLinkService {
  rpc AssembleTrackingLink(AssembleTrackingLinkRequest) returns (AssembleTrackingLinkResponse);
}

service TrackingRedirectService {
  rpc ResolveRedirect(ResolveRedirectRequest) returns (ResolveRedirectResponse);
}

service TrackingClickService {
  rpc AckClick(AckClickRequest) returns (AckClickResponse);
}

service TrackingConversionService {
  rpc IngestConversion(IngestConversionRequest) returns (IngestConversionResponse);
}

service TrackingCommissionViewService {
  rpc GetCommissionSummary(GetCommissionSummaryRequest) returns (GetCommissionSummaryResponse);

  rpc ListCommissionItems(ListCommissionItemsRequest) returns (ListCommissionItemsResponse);
}

syntax = "proto2";

package simple_living.governance_domain;

import "google/protobuf/timestamp.proto";

option cc_generic_services = true;
option go_package = "github.com/simple_living/services/governance-domain/proto;governancepb";

// Internal RPC contract for governance-domain. Aligns with services/governance-domain/docs/api.md.

enum ReviewQueueItemStatus {
  REVIEW_QUEUE_ITEM_STATUS_UNSPECIFIED = 0;
  REVIEW_QUEUE_ITEM_STATUS_PENDING = 1;
  REVIEW_QUEUE_ITEM_STATUS_IN_REVIEW = 2;
  REVIEW_QUEUE_ITEM_STATUS_COMPLETED = 3;
  REVIEW_QUEUE_ITEM_STATUS_CANCELLED = 4;
}

enum ReviewOutcome {
  REVIEW_OUTCOME_UNSPECIFIED = 0;
  REVIEW_OUTCOME_APPROVED = 1;
  REVIEW_OUTCOME_REJECTED = 2;
  REVIEW_OUTCOME_NEEDS_INFO = 3;
}

enum VisibilityState {
  VISIBILITY_STATE_UNSPECIFIED = 0;
  VISIBILITY_STATE_PUBLISHED = 1;
  VISIBILITY_STATE_UNPUBLISHED = 2;
  VISIBILITY_STATE_RESTRICTED = 3;
}

enum VisibilityVerdictSource {
  VISIBILITY_VERDICT_SOURCE_UNSPECIFIED = 0;
  VISIBILITY_VERDICT_SOURCE_REVIEW = 1;
  VISIBILITY_VERDICT_SOURCE_MANUAL_OPS = 2;
  VISIBILITY_VERDICT_SOURCE_POLICY = 3;
  VISIBILITY_VERDICT_SOURCE_SYSTEM = 4;
}

enum CooperationSubjectType {
  COOPERATION_SUBJECT_TYPE_UNSPECIFIED = 0;
  COOPERATION_SUBJECT_TYPE_CONTENT = 1;
  COOPERATION_SUBJECT_TYPE_CARD = 2;
  COOPERATION_SUBJECT_TYPE_TOPIC = 3;
  COOPERATION_SUBJECT_TYPE_RANKING = 4;
}

enum RiskSubjectType {
  RISK_SUBJECT_TYPE_UNSPECIFIED = 0;
  RISK_SUBJECT_TYPE_CONTENT = 1;
  RISK_SUBJECT_TYPE_ACCOUNT = 2;
  RISK_SUBJECT_TYPE_CHANNEL = 3;
}

enum RiskSeverity {
  RISK_SEVERITY_UNSPECIFIED = 0;
  RISK_SEVERITY_LOW = 1;
  RISK_SEVERITY_MEDIUM = 2;
  RISK_SEVERITY_HIGH = 3;
  RISK_SEVERITY_CRITICAL = 4;
}

enum PolicyVersionStatus {
  POLICY_VERSION_STATUS_UNSPECIFIED = 0;
  POLICY_VERSION_STATUS_DRAFT = 1;
  POLICY_VERSION_STATUS_ACTIVE = 2;
  POLICY_VERSION_STATUS_DEPRECATED = 3;
}

enum PolicyViolationSeverity {
  POLICY_VIOLATION_SEVERITY_UNSPECIFIED = 0;
  POLICY_VIOLATION_SEVERITY_INFO = 1;
  POLICY_VIOLATION_SEVERITY_WARNING = 2;
  POLICY_VIOLATION_SEVERITY_BLOCKING = 3;
}

enum RequiredActionType {
  REQUIRED_ACTION_TYPE_UNSPECIFIED = 0;
  REQUIRED_ACTION_TYPE_ADD_DISCLOSURE = 1;
  REQUIRED_ACTION_TYPE_UNPUBLISH = 2;
  REQUIRED_ACTION_TYPE_ENQUEUE_REVIEW = 3;
}

message PaginationCursor {
  optional string next_cursor = 1;
  optional bool has_more = 2;
  optional int32 limit = 3;
}

// Logical content reference for queue idempotency (content_id + optional content_version).
message ContentRef {
  optional string content_id = 1;
  optional string content_version = 2;
}

message ReviewQueueItem {
  optional string id = 1;
  optional string content_id = 2;
  optional string content_version = 3;
  optional ReviewQueueItemStatus status = 4;
  optional int32 priority = 5;
  optional string enqueue_reason = 6;
  repeated string channel_hints = 7;
  optional google.protobuf.Timestamp enqueued_at = 8;
}

message ReviewDecision {
  optional string id = 1;
  optional string queue_item_id = 2;
  optional string content_id = 3;
  optional ReviewOutcome outcome = 4;
  optional string comment = 5;
  optional string reviewer_id = 6;
  optional string policy_evaluation_id = 7;
  optional google.protobuf.Timestamp decided_at = 8;
}

message ReviewState {
  optional string content_id = 1;
  optional ReviewQueueItem latest_queue_item = 2;
  optional ReviewDecision latest_decision = 3;
}

message EnqueueReviewRequest {
  optional string client_request_id = 1;
  optional string content_id = 2;
  optional string content_version = 3;
  optional int32 priority = 4;
  optional string enqueue_reason = 5;
  repeated string channel_hints = 6;
  optional string audit_trace_id = 7;
}

message EnqueueReviewResponse {
  optional ReviewQueueItem queue_item = 1;
}

message ListReviewQueueItemsRequest {
  optional ReviewQueueItemStatus status = 1;
  optional string content_id_prefix = 2;
  optional string cursor = 3;
  optional int32 limit = 4;
}

message ListReviewQueueItemsResponse {
  repeated ReviewQueueItem items = 1;
  optional PaginationCursor pagination = 2;
}

message SubmitReviewDecisionRequest {
  optional string client_request_id = 1;
  optional string queue_item_id = 2;
  optional ReviewOutcome outcome = 3;
  optional string comment = 4;
  optional string reviewer_id = 5;
  optional string policy_evaluation_id = 6;
}

message SubmitReviewDecisionResponse {
  optional ReviewDecision decision = 1;
}

message ListReviewDecisionsRequest {
  optional string content_id = 1;
  optional string cursor = 2;
  optional int32 limit = 3;
}

message ListReviewDecisionsResponse {
  repeated ReviewDecision decisions = 1;
  optional PaginationCursor pagination = 2;
}

message GetReviewStateRequest {
  optional string content_id = 1;
}

message GetReviewStateResponse {
  optional ReviewState state = 1;
}

message CooperationLabel {
  optional string id = 1;
  optional CooperationSubjectType subject_type = 2;
  optional string subject_id = 3;
  optional string cooperation_type = 4;
  optional string disclosure_template_id = 5;
  optional google.protobuf.Timestamp effective_from = 6;
  optional google.protobuf.Timestamp effective_to = 7;
  map<string, string> metadata = 8;
}

message DisclosureTemplate {
  optional string id = 1;
  optional string locale = 2;
  optional string template_key = 3;
  optional string body = 4;
  optional int32 version = 5;
}

message UpsertCooperationLabelRequest {
  optional string client_request_id = 1;
  optional CooperationLabel label = 2;
}

message UpsertCooperationLabelResponse {
  optional CooperationLabel label = 1;
}

message SubjectKey {
  optional CooperationSubjectType subject_type = 1;
  optional string subject_id = 2;
}

message CooperationLabels {
  repeated CooperationLabel labels = 1;
}

message BatchGetCooperationLabelsRequest {
  repeated SubjectKey keys = 1;
}

message BatchGetCooperationLabelsResponse {
  map<string, CooperationLabels> labels_by_subject = 1;
}

message ListDisclosureTemplatesRequest {
  optional string locale = 1;
  optional string cursor = 2;
  optional int32 limit = 3;
}

message ListDisclosureTemplatesResponse {
  repeated DisclosureTemplate templates = 1;
  optional PaginationCursor pagination = 2;
}

message VisibilityVerdict {
  optional string id = 1;
  optional string content_id = 2;
  optional VisibilityState state = 3;
  optional string reason_code = 4;
  optional VisibilityVerdictSource source = 5;
  optional string source_ref_id = 6;
  optional google.protobuf.Timestamp effective_from = 7;
  optional int64 version = 8;
}

message SetVisibilityVerdictRequest {
  optional string client_request_id = 1;
  optional string content_id = 2;
  optional VisibilityState state = 3;
  optional string reason_code = 4;
  optional VisibilityVerdictSource source = 5;
  optional string source_ref_id = 6;
  optional google.protobuf.Timestamp effective_from = 7;
  optional int64 expected_version = 8;
}

message SetVisibilityVerdictResponse {
  optional VisibilityVerdict verdict = 1;
}

message VisibilityVerdictMutation {
  optional string content_id = 1;
  optional VisibilityState state = 2;
  optional string reason_code = 3;
  optional VisibilityVerdictSource source = 4;
  optional string source_ref_id = 5;
  optional google.protobuf.Timestamp effective_from = 6;
  optional int64 expected_version = 7;
}

message BatchSetVisibilityVerdictRequest {
  optional string client_request_id = 1;
  repeated VisibilityVerdictMutation items = 2;
}

message BatchSetVisibilityVerdictResponse {
  repeated VisibilityVerdict verdicts = 1;
  repeated string failed_content_ids = 2;
}

message GetVisibilityVerdictRequest {
  optional string content_id = 1;
}

message GetVisibilityVerdictResponse {
  optional VisibilityVerdict verdict = 1;
}

message EvaluateVisibilityRequest {
  optional string content_id = 1;
  optional string channel = 2;
  optional string user_segment = 3;
}

message EvaluateVisibilityResponse {
  optional bool allowed = 1;
  repeated string reason_codes = 2;
  optional VisibilityVerdict verdict = 3;
}

message OpsConfigSnapshot {
  optional string config_key = 1;
  optional int32 version = 2;
  optional string payload_json = 3;
  optional google.protobuf.Timestamp released_at = 4;
  optional string released_by = 5;
}

message OpsConfigDraft {
  optional string id = 1;
  optional string config_key = 2;
  optional string payload_json = 3;
  optional string created_by = 4;
  optional google.protobuf.Timestamp updated_at = 5;
}

message GetOpsConfigSnapshotRequest {
  optional string config_key = 1;
  optional int32 version = 2;
}

message GetOpsConfigSnapshotResponse {
  optional OpsConfigSnapshot snapshot = 1;
}

message CreateOpsConfigDraftRequest {
  optional string client_request_id = 1;
  optional string config_key = 2;
  optional string payload_json = 3;
  optional string created_by = 4;
}

message CreateOpsConfigDraftResponse {
  optional OpsConfigDraft draft = 1;
}

message ReleaseOpsConfigRequest {
  optional string client_request_id = 1;
  optional string draft_id = 2;
  optional string released_by = 3;
}

message ReleaseOpsConfigResponse {
  optional OpsConfigSnapshot snapshot = 1;
}

message RollbackOpsConfigReleaseRequest {
  optional string client_request_id = 1;
  optional string config_key = 2;
  optional int32 target_version = 3;
  optional string released_by = 4;
}

message RollbackOpsConfigReleaseResponse {
  optional OpsConfigSnapshot snapshot = 1;
}

message RiskFlag {
  optional string id = 1;
  optional RiskSubjectType subject_type = 2;
  optional string subject_id = 3;
  optional string flag_code = 4;
  optional RiskSeverity severity = 5;
  optional string source = 6;
  optional google.protobuf.Timestamp expires_at = 7;
  optional bool active = 8;
  optional google.protobuf.Timestamp created_at = 9;
}

message CreateRiskFlagRequest {
  optional string client_request_id = 1;
  optional RiskSubjectType subject_type = 2;
  optional string subject_id = 3;
  optional string flag_code = 4;
  optional RiskSeverity severity = 5;
  optional string source = 6;
  optional google.protobuf.Timestamp expires_at = 7;
}

message CreateRiskFlagResponse {
  optional RiskFlag flag = 1;
}

message RevokeRiskFlagRequest {
  optional string client_request_id = 1;
  optional string flag_id = 2;
  optional string revoked_by = 3;
}

message RevokeRiskFlagResponse {
  optional RiskFlag flag = 1;
}

message ListRiskFlagsRequest {
  optional RiskSubjectType subject_type = 1;
  optional string subject_id = 2;
  optional bool active_only = 3;
  optional string cursor = 4;
  optional int32 limit = 5;
}

message ListRiskFlagsResponse {
  repeated RiskFlag flags = 1;
  optional PaginationCursor pagination = 2;
}

message RiskSubjectKey {
  optional RiskSubjectType subject_type = 1;
  optional string subject_id = 2;
}

message RiskFlagList {
  repeated RiskFlag flags = 1;
}

message BatchGetRiskFlagsBySubjectRequest {
  repeated RiskSubjectKey keys = 1;
  optional bool active_only = 2;
}

message BatchGetRiskFlagsBySubjectResponse {
  map<string, RiskFlagList> flags_by_subject = 1;
}

message PolicyViolation {
  optional string code = 1;
  optional string message = 2;
  optional PolicyViolationSeverity severity = 3;
}

message RequiredAction {
  optional RequiredActionType type = 1;
  optional string detail = 2;
}

message PolicyEvaluationContext {
  optional string content_id = 1;
  optional CooperationSubjectType subject_type = 2;
  optional string subject_id = 3;
  map<string, string> attributes = 4;
  optional string channel = 5;
}

message PolicyVersion {
  optional string id = 1;
  optional string version_label = 2;
  optional string ruleset_ref = 3;
  optional string ruleset_json = 4;
  optional PolicyVersionStatus status = 5;
  optional google.protobuf.Timestamp effective_from = 6;
}

message EvaluatePolicyRequest {
  optional PolicyEvaluationContext context = 1;
  optional string policy_version_id = 2;
}

message EvaluatePolicyResponse {
  optional string evaluation_id = 1;
  repeated PolicyViolation violations = 2;
  repeated RequiredAction required_actions = 3;
}

message CreatePolicyVersionRequest {
  optional string client_request_id = 1;
  optional PolicyVersion version = 2;
}

message CreatePolicyVersionResponse {
  optional PolicyVersion version = 1;
}

message SimulatePolicyRequest {
  optional PolicyEvaluationContext context = 1;
  optional string policy_version_id = 2;
}

message SimulatePolicyResponse {
  optional string evaluation_id = 1;
  repeated PolicyViolation violations = 2;
  repeated RequiredAction required_actions = 3;
}

service GovernanceReviewService {
  rpc EnqueueReview(EnqueueReviewRequest) returns (EnqueueReviewResponse);
  rpc ListReviewQueueItems(ListReviewQueueItemsRequest) returns (ListReviewQueueItemsResponse);
  rpc SubmitReviewDecision(SubmitReviewDecisionRequest) returns (SubmitReviewDecisionResponse);
  rpc ListReviewDecisions(ListReviewDecisionsRequest) returns (ListReviewDecisionsResponse);
  rpc GetReviewState(GetReviewStateRequest) returns (GetReviewStateResponse);
}

service GovernanceCooperationService {
  rpc UpsertCooperationLabel(UpsertCooperationLabelRequest) returns (UpsertCooperationLabelResponse);
  rpc BatchGetCooperationLabels(BatchGetCooperationLabelsRequest) returns (BatchGetCooperationLabelsResponse);
  rpc ListDisclosureTemplates(ListDisclosureTemplatesRequest) returns (ListDisclosureTemplatesResponse);
}

service GovernanceVisibilityService {
  rpc SetVisibilityVerdict(SetVisibilityVerdictRequest) returns (SetVisibilityVerdictResponse);
  rpc BatchSetVisibilityVerdict(BatchSetVisibilityVerdictRequest) returns (BatchSetVisibilityVerdictResponse);
  rpc GetVisibilityVerdict(GetVisibilityVerdictRequest) returns (GetVisibilityVerdictResponse);
  rpc EvaluateVisibility(EvaluateVisibilityRequest) returns (EvaluateVisibilityResponse);
}

service GovernanceOpsConfigService {
  rpc GetOpsConfigSnapshot(GetOpsConfigSnapshotRequest) returns (GetOpsConfigSnapshotResponse);
  rpc CreateOpsConfigDraft(CreateOpsConfigDraftRequest) returns (CreateOpsConfigDraftResponse);
  rpc ReleaseOpsConfig(ReleaseOpsConfigRequest) returns (ReleaseOpsConfigResponse);
  rpc RollbackOpsConfigRelease(RollbackOpsConfigReleaseRequest) returns (RollbackOpsConfigReleaseResponse);
}

service GovernanceRiskService {
  rpc CreateRiskFlag(CreateRiskFlagRequest) returns (CreateRiskFlagResponse);
  rpc RevokeRiskFlag(RevokeRiskFlagRequest) returns (RevokeRiskFlagResponse);
  rpc ListRiskFlags(ListRiskFlagsRequest) returns (ListRiskFlagsResponse);
  rpc BatchGetRiskFlagsBySubject(BatchGetRiskFlagsBySubjectRequest) returns (BatchGetRiskFlagsBySubjectResponse);
}

service GovernancePolicyService {
  rpc EvaluatePolicy(EvaluatePolicyRequest) returns (EvaluatePolicyResponse);
  rpc CreatePolicyVersion(CreatePolicyVersionRequest) returns (CreatePolicyVersionResponse);
  rpc SimulatePolicy(SimulatePolicyRequest) returns (SimulatePolicyResponse);
}

syntax = "proto2";

package simple_living.affiliate_server;

import "google/protobuf/timestamp.proto";

option cc_generic_services = true;
option go_package = "github.com/simple_living/services/platform/backoffice-backend/proto;affiliatepb";

// Internal gRPC API for platform/backoffice-backend.
// Human-maintained contract: services/platform/api.md

// --- Enums ---

enum PartnerLifecycleStatus {
  PARTNER_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  PARTNER_LIFECYCLE_STATUS_DRAFT = 1;
  PARTNER_LIFECYCLE_STATUS_ACTIVE = 2;
  PARTNER_LIFECYCLE_STATUS_SUNSET = 3;
  PARTNER_LIFECYCLE_STATUS_DISABLED = 4;
}

enum ReportingChannel {
  REPORTING_CHANNEL_UNSPECIFIED = 0;
  REPORTING_CHANNEL_API = 1;
  REPORTING_CHANNEL_WEBHOOK = 2;
  REPORTING_CHANNEL_SFTP = 3;
  REPORTING_CHANNEL_MANUAL_UPLOAD = 4;
}

enum CapabilityFlag {
  CAPABILITY_FLAG_UNSPECIFIED = 0;
  CAPABILITY_FLAG_DEEP_LINK = 1;
  CAPABILITY_FLAG_COUPON_CODE = 2;
  CAPABILITY_FLAG_SUB_ID_SLOTS = 3;
  CAPABILITY_FLAG_DAILY_ORDER_REPORT = 4;
}

enum LinkParamBindingKind {
  LINK_PARAM_BINDING_KIND_UNSPECIFIED = 0;
  LINK_PARAM_BINDING_KIND_LITERAL = 1;
  LINK_PARAM_BINDING_KIND_TEMPLATE = 2;
  LINK_PARAM_BINDING_KIND_REF_TOKEN = 3;
}

enum CommissionEventStatus {
  COMMISSION_EVENT_STATUS_UNSPECIFIED = 0;
  COMMISSION_EVENT_STATUS_PENDING = 1;
  COMMISSION_EVENT_STATUS_CONFIRMED = 2;
  COMMISSION_EVENT_STATUS_REVERSED = 3;
  COMMISSION_EVENT_STATUS_INVALID = 4;
}

enum AffiliateErrorCode {
  AFFILIATE_ERROR_CODE_UNSPECIFIED = 0;
  AFFILIATE_ERROR_CODE_PARTNER_NOT_FOUND = 1;
  AFFILIATE_ERROR_CODE_PARTNER_DISABLED = 2;
  AFFILIATE_ERROR_CODE_VALIDATION_FAILED = 3;
  AFFILIATE_ERROR_CODE_SUB_ID_VIOLATION = 4;
  AFFILIATE_ERROR_CODE_TOKEN_UNAVAILABLE = 5;
  AFFILIATE_ERROR_CODE_WEBHOOK_SIGNATURE_INVALID = 6;
  AFFILIATE_ERROR_CODE_DUPLICATE_INGEST = 7;
  AFFILIATE_ERROR_CODE_RULE_VERSION_CONFLICT = 8;
}

// --- Nested / shared messages ---

message LinkConstraints {
  optional int32 max_url_length = 1;
  optional string allowed_query_key_regex = 2;
  repeated string required_query_keys = 3;
  repeated string forbidden_query_combinations = 4;
}

message ReportingProfile {
  repeated ReportingChannel channels = 1;
  optional int32 expected_latency_hours = 2;
  optional string freshness_notes = 3;
}

message PartnerCapabilitySnapshot {
  optional string partner_id = 1;
  optional string capability_set_id = 2;
  optional PartnerLifecycleStatus lifecycle_status = 3;
  repeated CapabilityFlag flags = 4;
  optional LinkConstraints link_constraints = 5;
  optional ReportingProfile reporting = 6;
  optional string display_name = 7;
  optional string primary_channel_code = 8;
}

message ListPartnersRequest {}

message ListPartnersResponse {
  repeated PartnerCapabilitySnapshot items = 1;
}

message UpsertPartnerBackofficeRequest {
  optional PartnerCapabilitySnapshot partner = 1;
}

message UpsertPartnerBackofficeResponse {
  optional PartnerCapabilitySnapshot partner = 1;
}

message ComplianceContext {
  optional string region_code = 1;
  optional string disclosure_mode = 2;
  repeated string restricted_category_flags = 3;
}

message LinkGenerationInput {
  optional string input_id = 1;
  optional string partner_id = 2;
  optional string campaign_ref = 3;
  repeated string product_refs = 4;
  map<string, string> sub_ids = 5;
  optional string placement = 6;
  optional ComplianceContext compliance_context = 7;
}

message ValidationIssue {
  optional string code = 1;
  optional string field_path = 2;
  optional string message = 3;
}

message QueryParamBinding {
  optional string name = 1;
  optional LinkParamBindingKind kind = 2;
  optional string literal_value = 3;
  optional string template_value = 4;
  optional string token_handle = 5;
}

message SignatureSpec {
  optional string algorithm = 1;
  repeated string signed_param_names = 2;
  optional string key_version = 3;
}

message TokenHandle {
  optional string handle_id = 1;
  optional google.protobuf.Timestamp refresh_before = 2;
}

message AffiliateLinkSpec {
  optional string spec_id = 1;
  optional string partner_id = 2;
  optional google.protobuf.Timestamp expires_at = 3;
  optional string target_base = 4;
  repeated QueryParamBinding query_params = 5;
  optional SignatureSpec signature_spec = 6;
  repeated TokenHandle token_handles = 7;
}

message CorrelationHints {
  optional string click_id = 1;
  map<string, string> sub_ids = 2;
  optional string external_order_id = 3;
}

message CommissionNormalizedEvent {
  optional string event_id = 1;
  optional string partner_id = 2;
  optional google.protobuf.Timestamp occurred_at = 3;
  optional int64 amount_minor = 4;
  optional string currency = 5;
  optional CommissionEventStatus status = 6;
  optional CorrelationHints correlation_hints = 7;
}

message AffiliateErrorDetail {
  optional AffiliateErrorCode code = 1;
  optional string partner_id = 2;
  optional bool retryable = 3;
}

// --- RPC messages: Partner ---

message GetPartnerCapabilitySnapshotRequest {
  optional string partner_id = 1;
  optional string environment = 2;
}

message GetPartnerCapabilitySnapshotResponse {
  optional PartnerCapabilitySnapshot snapshot = 1;
}

message ValidateLinkGenerationInputRequest {
  optional LinkGenerationInput input = 1;
  optional string idempotency_key = 2;
}

message ValidateLinkGenerationInputResponse {
  optional AffiliateLinkSpec spec = 1;
  repeated ValidationIssue validation_issues = 2;
}

// --- RPC messages: Commission rules ---

message CreateCommissionRuleSetVersionRequest {
  optional string partner_id = 1;
  optional google.protobuf.Timestamp effective_from = 2;
  optional google.protobuf.Timestamp effective_to = 3;
  optional string source_reference = 4;
  optional bytes rule_payload = 5;
  optional string idempotency_key = 6;
}

message CreateCommissionRuleSetVersionResponse {
  optional string rule_set_id = 1;
  optional int32 version = 2;
}

message GetCommissionRuleSetRequest {
  optional string partner_id = 1;
  optional google.protobuf.Timestamp as_of = 2;
}

message GetCommissionRuleSetResponse {
  optional string rule_set_id = 1;
  optional int32 version = 2;
  optional google.protobuf.Timestamp effective_from = 3;
  optional google.protobuf.Timestamp effective_to = 4;
  optional bytes rule_payload = 5;
}

// --- RPC messages: Intake ---

message IngestPartnerWebhookRequest {
  optional string partner_id = 1;
  optional string partner_event_id = 2;
  optional string headers_fingerprint = 3;
  optional bytes raw_body = 4;
  optional google.protobuf.Timestamp received_at = 5;
}

message IngestPartnerWebhookResponse {
  optional bool accepted = 1;
  optional CommissionNormalizedEvent normalized_event = 2;
}

message RegisterReportBatchRequest {
  optional string partner_id = 1;
  optional ReportingChannel channel = 2;
  optional string batch_checksum = 3;
  optional string payload_ref = 4;
  optional int32 row_count_estimate = 5;
}

message RegisterReportBatchResponse {
  optional string batch_id = 1;
  optional bool duplicate = 2;
}

// --- Services ---

service AffiliatePartnerService {
  rpc GetPartnerCapabilitySnapshot(GetPartnerCapabilitySnapshotRequest)
      returns (GetPartnerCapabilitySnapshotResponse);

  rpc ValidateLinkGenerationInput(ValidateLinkGenerationInputRequest)
      returns (ValidateLinkGenerationInputResponse);

  rpc ListPartners(ListPartnersRequest) returns (ListPartnersResponse);

  rpc UpsertPartnerBackoffice(UpsertPartnerBackofficeRequest)
      returns (UpsertPartnerBackofficeResponse);
}

service AffiliateCommissionRuleService {
  rpc CreateCommissionRuleSetVersion(CreateCommissionRuleSetVersionRequest)
      returns (CreateCommissionRuleSetVersionResponse);

  rpc GetCommissionRuleSet(GetCommissionRuleSetRequest) returns (GetCommissionRuleSetResponse);
}

service AffiliateIntakeService {
  rpc IngestPartnerWebhook(IngestPartnerWebhookRequest) returns (IngestPartnerWebhookResponse);

  rpc RegisterReportBatch(RegisterReportBatchRequest) returns (RegisterReportBatchResponse);
}

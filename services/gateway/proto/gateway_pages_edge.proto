syntax = "proto2";

package simple_living.gateway.pages;

option cc_generic_services = true;
option go_package = "github.com/simple_living/services/gateway/proto/gwpagespb;gwpagespb";

import "google/protobuf/timestamp.proto";

// Gateway page aggregation edge messages. These are gateway-owned edge contracts
// that map public JSON routes to internal RPC orchestration.

message HomeFeedRequest {
  optional string cursor = 1;
  optional int32 limit = 2;
  optional string theme = 3;
}

message GuideCardSummary {
  optional string guide_card_id = 1;
  optional string title = 2;
  optional string subtitle = 3;
  optional string summary = 4;
  optional string cover_url = 5;
  optional string theme = 6;
}

message GuideCardDetail {
  optional string guide_card_id = 1;
  optional string title = 2;
  optional string subtitle = 3;
  optional string summary = 4;
  optional string cover_url = 5;
  optional string theme = 6;
  repeated string tags = 7;
  optional bool is_commercial = 8;
  optional string partner_id = 9;
  optional string disclosure_text_key = 10;
  optional google.protobuf.Timestamp published_at = 11;
  optional google.protobuf.Timestamp updated_at = 12;
}

message HomeFeedItem {
  optional string recommendation_id = 1;
  optional string scene = 2;
  optional int32 rank = 3;
  optional string guide_card_id = 4;
  optional GuideCardSummary guide_card = 5;
  repeated string reason_tags = 6;
}

message PaginationMeta {
  optional string next_cursor = 1;
  optional bool has_more = 2;
  optional int32 limit = 3;
}

message HomeFeedResponse {
  repeated HomeFeedItem items = 1;
  optional PaginationMeta pagination = 2;
}

message GuideDetailRequest {
  optional string guide_card_id = 1;
  optional bool include_related = 2;
}

message GuideDisclosure {
  optional bool is_commercial = 1;
  optional string partner_id = 2;
  optional string disclosure_text_key = 3;
}

message GuideDetailResponse {
  optional GuideCardDetail guide_card = 1;
  optional GuideDisclosure disclosures = 2;
  repeated HomeFeedItem related = 3;
}

message RedirectPrepareRequest {
  optional string guide_card_id = 1;
  optional string recommendation_id = 2;
  optional string scene = 3;
  optional int32 item_rank = 4;
  optional string preferred_channel_code = 5;
}

message AttributionEcho {
  optional string click_id = 1;
  optional string channel_code = 2;
  optional string recommendation_id = 3;
  optional string scene = 4;
  optional int32 item_rank = 5;
}

message RedirectPrepareResponse {
  optional string landing_url = 1;
  optional string click_id = 2;
  optional google.protobuf.Timestamp expires_at = 3;
  optional AttributionEcho attribution = 4;
}

message MeSummaryRequest {}

message ProfileBlock {
  optional string user_id = 1;
  optional bool is_guest = 2;
  optional string display_name = 3;
  optional string avatar_url = 4;
  optional string locale = 5;
}

message CountsBlock {
  optional int64 favorites_count = 1;
  optional int64 history_count = 2;
}

message ConsentBlock {
  optional bool personalization_allowed = 1;
  optional bool analytics_allowed = 2;
  optional bool marketing_allowed = 3;
  optional string consent_version = 4;
}

message MeSummaryResponse {
  optional ProfileBlock profile = 1;
  optional CountsBlock counts = 2;
  optional ConsentBlock consent = 3;
}

message BackofficePartner {
  optional string partner_id = 1;
  optional string display_name = 2;
  optional string status = 3;
  optional string primary_channel_code = 4;
}

message BackofficeListPartnersRequest {}

message BackofficeCreatePartnerRequest {
  optional string partner_id = 1;
  optional string display_name = 2;
  optional string status = 3;
  optional string primary_channel_code = 4;
}

message BackofficePartnersResponse {
  repeated BackofficePartner items = 1;
}

message BackofficeLoginRequest {
  optional string access_token = 1;
}

message BackofficeLoginResponse {
  optional bool success = 1;
  optional string token = 2;
  optional string role = 3;
}

message BackofficeMediaRef {
  optional string media_id = 1;
  optional string url = 2;
  optional string type = 3;
  optional int32 width = 4;
  optional int32 height = 5;
}

message BackofficeAffiliateRef {
  optional string channel = 1;
  optional string external_item_id = 2;
  optional string external_shop_id = 3;
}

message BackofficeContentItem {
  optional string content_id = 1;
  optional string resource_kind = 2;
  optional string title = 3;
  optional string subtitle = 4;
  repeated string theme_ids = 5;
  repeated string tag_ids = 6;
  optional string content_status = 7;
  optional int64 revision = 8;
  optional int64 published_revision = 9;
  optional string summary = 10;
  optional BackofficeMediaRef cover_media = 11;
  optional string landing_url = 12;
  optional string external_item_id = 13;
  repeated BackofficeAffiliateRef affiliate_refs = 14;
  repeated string selling_points = 15;
  optional bool commercial_disclosure_required = 16;
  optional string effective_from = 17;
  optional string effective_to = 18;
  optional string created_at = 19;
  optional string updated_at = 20;
  optional string created_by = 21;
  optional string updated_by = 22;
  // Legacy single-theme field for backward compatibility.
  optional string theme = 23;
  optional string status = 24;
}

message BackofficeContentRevision {
  optional int64 revision = 1;
  optional string created_at = 2;
  optional string created_by = 3;
  optional string change_summary = 4;
}

message BackofficeReviewState {
  optional string review_id = 1;
  optional string status = 2;
  optional string submitted_at = 3;
  optional string reviewer_id = 4;
  optional string comment = 5;
}

message BackofficeVisibilityVerdict {
  optional string state = 1;
  optional string reason_code = 2;
  optional string source = 3;
  optional string effective_from = 4;
  optional int64 version = 5;
}

message BackofficeContentDetailResponse {
  optional BackofficeContentItem content = 1;
  repeated BackofficeContentRevision revision_history = 2;
  optional BackofficeReviewState review_state = 3;
  optional BackofficeVisibilityVerdict visibility_verdict = 4;
}

message BackofficeListContentItemsRequest {}

message BackofficeCreateContentItemRequest {
  optional string resource_kind = 1;
  optional string title = 2;
  optional string subtitle = 3;
  optional string summary = 4;
  repeated string theme_ids = 5;
  repeated string tag_ids = 6;
  optional BackofficeMediaRef cover_media = 7;
  optional string landing_url = 8;
  optional string external_item_id = 9;
  repeated BackofficeAffiliateRef affiliate_refs = 10;
  repeated string selling_points = 11;
  optional bool commercial_disclosure_required = 12;
  optional string effective_from = 13;
  optional string effective_to = 14;
  optional string initial_status = 15;
  // Legacy fields.
  optional string theme = 16;
  optional string status = 17;
}

message BackofficeUpdateContentStatusRequest {
  optional string content_id = 1;
  optional string status = 2;
}

message BackofficeUpdateContentItemRequest {
  optional string content_id = 1;
  optional int64 revision = 2;
  optional string title = 3;
  optional string subtitle = 4;
  optional string summary = 5;
  optional string landing_url = 6;
  optional string external_item_id = 7;
  optional BackofficeMediaRef cover_media = 8;
  repeated string theme_ids = 9;
  repeated string tag_ids = 10;
  repeated BackofficeAffiliateRef affiliate_refs = 11;
  repeated string selling_points = 12;
  optional bool commercial_disclosure_required = 13;
  optional string effective_from = 14;
  optional string effective_to = 15;
  optional string change_summary = 16;
  // Legacy.
  optional string cover_url = 17;
  optional string theme = 18;
}

message BackofficeContentDetailRequest {
  optional string content_id = 1;
}

message BackofficeSubmitReviewRequest {
  optional string content_id = 1;
  optional int64 revision = 2;
  optional string change_summary = 3;
}

message BackofficeSubmitReviewResponse {
  optional bool success = 1;
  optional string review_id = 2;
  optional string content_status = 3;
}

message BackofficePublishRequest {
  optional string content_id = 1;
  optional int64 revision = 2;
}

message BackofficePublishResponse {
  optional bool success = 1;
  optional string content_id = 2;
  optional int64 published_revision = 3;
  optional string visibility_state = 4;
}

message BackofficeRollbackRequest {
  optional string content_id = 1;
  optional int64 target_revision = 2;
  optional string change_summary = 3;
}

message BackofficeRollbackResponse {
  optional bool success = 1;
  optional int64 new_revision = 2;
  optional string content_id = 3;
}

message BackofficeSetVisibilityRequest {
  optional string content_id = 1;
  optional string state = 2;
  optional string reason_code = 3;
  optional string effective_from = 4;
}

message BackofficeSetVisibilityResponse {
  optional bool success = 1;
  optional string content_id = 2;
  optional string visibility_state = 3;
}

message BackofficeContentItemsResponse {
  repeated BackofficeContentItem items = 1;
}

message BackofficeReviewItem {
  optional string review_id = 1;
  optional string subject_id = 2;
  optional string status = 3;
  optional string resource_kind = 4;
  optional int32 priority = 5;
  optional string enqueue_reason = 6;
  optional string enqueued_at = 7;
  optional string reviewer_id = 8;
  optional string comment = 9;
  optional string decided_at = 10;
}

message BackofficeListReviewsRequest {}

message BackofficeUpdateReviewStatusRequest {
  optional string review_id = 1;
  optional string status = 2;
}

message BackofficeReviewsResponse {
  repeated BackofficeReviewItem items = 1;
}

service GatewayPagesEdgeV2 {
  rpc GetHomeFeed(HomeFeedRequest) returns (HomeFeedResponse);
  rpc GetGuideDetail(GuideDetailRequest) returns (GuideDetailResponse);
  rpc PrepareRedirect(RedirectPrepareRequest) returns (RedirectPrepareResponse);
  rpc GetMeSummary(MeSummaryRequest) returns (MeSummaryResponse);
  rpc PostBackofficeLogin(BackofficeLoginRequest) returns (BackofficeLoginResponse);
  rpc GetBackofficeAffiliatePartners(BackofficeListPartnersRequest) returns (BackofficePartnersResponse);
  rpc PostBackofficeAffiliatePartner(BackofficeCreatePartnerRequest) returns (BackofficePartnersResponse);
  rpc GetBackofficeContentItems(BackofficeListContentItemsRequest) returns (BackofficeContentItemsResponse);
  rpc PostBackofficeContentItem(BackofficeCreateContentItemRequest) returns (BackofficeContentItemsResponse);
  rpc PatchBackofficeContentItemStatus(BackofficeUpdateContentStatusRequest) returns (BackofficeContentItemsResponse);
  rpc PostBackofficeContentItemUpdate(BackofficeUpdateContentItemRequest) returns (BackofficeContentItemsResponse);
  rpc PostBackofficeContentItemDetail(BackofficeContentDetailRequest) returns (BackofficeContentDetailResponse);
  rpc PostBackofficeContentItemSubmitReview(BackofficeSubmitReviewRequest) returns (BackofficeSubmitReviewResponse);
  rpc PostBackofficeContentItemPublish(BackofficePublishRequest) returns (BackofficePublishResponse);
  rpc PostBackofficeContentItemRollback(BackofficeRollbackRequest) returns (BackofficeRollbackResponse);
  rpc GetBackofficeGovernanceReviews(BackofficeListReviewsRequest) returns (BackofficeReviewsResponse);
  rpc PatchBackofficeGovernanceReviewStatus(BackofficeUpdateReviewStatusRequest) returns (BackofficeReviewsResponse);
  rpc PostBackofficeGovernanceVisibility(BackofficeSetVisibilityRequest) returns (BackofficeSetVisibilityResponse);
}

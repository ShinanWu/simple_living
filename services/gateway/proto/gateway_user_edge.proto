syntax = "proto2";

package simple_living.gateway.user;

option cc_generic_services = true;
option go_package = "github.com/simple_living/services/gateway/proto/gwuserpb;gwuserpb";

// protoc -I . -I ../../user-server/proto gateway_user_edge.proto
import "google/protobuf/empty.proto";
import "user_server_models.proto";
import "gateway_user_http_messages.proto";

// --- Edge service: logical mapping from public HTTP handlers to user-server shapes ---
// Implementations validate JSON, inject identity from headers, then call UserServerService.

service GatewayUserEdgeV2 {
  rpc PostGuestSession(GuestSessionHttpRequest)
      returns (simple_living.user_server.EnsureGuestSessionResponse);

  rpc PostAuthTokenIssue(TokenIssueHttpRequest)
      returns (simple_living.user_server.IssueTokenPairResponse);

  rpc PostAuthTokenRefresh(RefreshTokenHttpRequest)
      returns (simple_living.user_server.IssueTokenPairResponse);

  rpc DeleteAuthSession(RevokeSessionHttpRequest)
      returns (simple_living.user_server.RevokeSessionResponse);

  // Same URL as GET/PATCH; brpc restful maps are path-only, so HTTP method is dispatched in code.
  rpc MeProfileHttp(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc MePreferencesHttp(google.protobuf.Empty) returns (google.protobuf.Empty);

  // GET lists favorites; POST adds a favorite (HTTP method dispatched in code).
  rpc GetMeFavorites(ListFavoritesHttpRequest)
      returns (simple_living.user_server.ListFavoritesResponse);

  rpc DeleteMeFavorite(RemoveFavoriteHttpRequest)
      returns (simple_living.user_server.RemoveFavoriteResponse);

  rpc MeHistoryHttp(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc PostMeHistoryEvent(RecordHistoryEventHttpRequest)
      returns (simple_living.user_server.RecordHistoryEventResponse);

  rpc PostMeFeedback(SubmitFeedbackHttpRequest)
      returns (simple_living.user_server.SubmitFeedbackResponse);

  rpc MeConsentHttp(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc GetMeSummary(simple_living.user_server.GetMeSummaryRequest)
      returns (simple_living.user_server.GetMeSummaryResponse);

  rpc GetHealth(simple_living.user_server.HealthCheckRequest)
      returns (simple_living.user_server.HealthCheckResponse);
}

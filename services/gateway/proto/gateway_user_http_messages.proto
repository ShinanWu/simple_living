syntax = "proto2";

package simple_living.gateway.user;

option go_package = "github.com/simple_living/services/gateway/proto/gwuserpb;gwuserpb";

// protoc -I . -I ../../user-domain/proto gateway_user_http_messages.proto
import "user_domain_models.proto";

// JSON-oriented bodies and query-backed shapes for the user edge. Timestamps that arrive as
// ISO 8601 strings in HTTP are parsed by the gateway before building user-domain Timestamp fields.

message RefreshTokenHttpRequest {
  optional string refresh_token = 1;
  optional simple_living.user_domain.RpcRequestContext request_context = 2;
}

// Public JSON uses lowercase platform strings (see services/gateway/docs/api.md).
message GuestSessionHttpRequest {
  optional string device_id = 1;
  optional string client_platform = 2;
  optional string app_version = 3;
}

message AccountProofHttp {
  optional string user_id = 1;
}

message TokenIssueHttpRequest {
  optional AccountProofHttp account_proof = 1;
  optional string device_fingerprint = 2;
  optional string client_platform = 3;
  optional string app_version = 4;
  optional string device_id = 5;
}

message RevokeSessionHttpRequest {
  optional string revoke_scope = 1;
}

message PreferencesBodyHttp {
  optional int32 preferences_version = 1;
  repeated string themes = 2;
}

message PutMePreferencesHttpRequest {
  optional PreferencesBodyHttp preferences = 1;
}

message ListFavoritesHttpRequest {
  optional string acting_user_id = 1;
  optional string cursor = 2;
  optional int32 limit = 3;
  optional simple_living.user_domain.FavoriteContentType content_type = 4;
}

message AddFavoriteHttpRequest {
  optional string acting_user_id = 1;
  optional string guide_card_id = 2;
}

message RemoveFavoriteHttpRequest {
  optional string acting_user_id = 1;
  optional string favorite_id = 2;
}

message ListHistoryHttpRequest {
  oneof owner {
    string acting_user_id = 1;
    string session_id = 2;
  }
  optional string cursor = 3;
  optional int32 limit = 4;
}

message RecordHistoryEventHttpRequest {
  oneof owner {
    string acting_user_id = 1;
    string session_id = 2;
  }
  optional simple_living.user_domain.ContentRef content_ref = 3;
  optional string occurred_at = 4;
  optional simple_living.user_domain.HistorySourceSurface source_surface = 5;
  optional string client_event_id = 6;
}

message ClearHistoryHttpRequest {
  oneof owner {
    string acting_user_id = 1;
    string session_id = 2;
  }
  // Public JSON uses short strings (e.g. "all"), not protobuf enum names.
  optional string scope = 3;
  optional string before_time = 4;
}

message SubmitFeedbackHttpRequest {
  oneof actor {
    string acting_user_id = 1;
    string session_id = 2;
  }
  // Public JSON uses short strings (e.g. "guide_card"); see api.md.
  optional string target_type = 3;
  optional string target_id = 4;
  optional double rating = 5;
  repeated string reason_codes = 6;
  optional string free_text = 7;
  optional string client_request_id = 8;
}

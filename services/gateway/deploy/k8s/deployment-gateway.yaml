apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: simple-living
  labels:
    app: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: registry.example.com/simple-living/gateway:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: common-env
            - secretRef:
                name: app-secrets
          readinessProbe:
            # Placeholder probe path/port. Align with real gateway health endpoint.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Placeholder probe path/port. Align with real gateway health endpoint.
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            # Placeholder resources, tune from production metrics.
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

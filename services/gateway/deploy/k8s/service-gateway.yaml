apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: simple-living
  annotations:
    simple-living.io/internal-dns: "gateway.simple-living.svc.cluster.local"
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

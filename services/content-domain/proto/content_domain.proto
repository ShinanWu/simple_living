syntax = "proto2";

package simple_living.content_domain;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option cc_generic_services = true;
option go_package = "github.com/simple_living/services/content-domain/proto;contentpb";

// Internal RPC contract for content-domain. Aligns with services/content-domain/docs/api.md.

// --- Enums ---

enum LifeTheme {
  LIFE_THEME_UNSPECIFIED = 0;
  LIFE_THEME_CLOTHING = 1;
  LIFE_THEME_FOOD = 2;
  LIFE_THEME_HOUSING = 3;
  LIFE_THEME_MOBILITY = 4;
}

enum ThemeStatus {
  THEME_STATUS_UNSPECIFIED = 0;
  THEME_STATUS_ACTIVE = 1;
  THEME_STATUS_INACTIVE = 2;
}

enum ContentLifecycleStatus {
  CONTENT_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  CONTENT_LIFECYCLE_STATUS_DRAFT = 1;
  CONTENT_LIFECYCLE_STATUS_IN_REVIEW = 2;
  CONTENT_LIFECYCLE_STATUS_PUBLISHED = 3;
  CONTENT_LIFECYCLE_STATUS_SCHEDULED = 4;
  CONTENT_LIFECYCLE_STATUS_OFFLINE = 5;
  CONTENT_LIFECYCLE_STATUS_ARCHIVED = 6;
}

enum GuideCardType {
  GUIDE_CARD_TYPE_UNSPECIFIED = 0;
  GUIDE_CARD_TYPE_PHYSICAL_GOOD = 1;
  GUIDE_CARD_TYPE_DIGITAL_GOOD = 2;
  GUIDE_CARD_TYPE_LOCAL_SERVICE = 3;
  GUIDE_CARD_TYPE_OTHER = 4;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
  MEDIA_TYPE_ICON = 3;
}

enum EditorialBlockType {
  EDITORIAL_BLOCK_TYPE_UNSPECIFIED = 0;
  EDITORIAL_BLOCK_TYPE_PARAGRAPH = 1;
  EDITORIAL_BLOCK_TYPE_HEADING = 2;
  EDITORIAL_BLOCK_TYPE_IMAGE = 3;
  EDITORIAL_BLOCK_TYPE_EMBED_CARD = 4;
  EDITORIAL_BLOCK_TYPE_QUOTE = 5;
  EDITORIAL_BLOCK_TYPE_BULLET_LIST = 6;
}

enum TopicModuleType {
  TOPIC_MODULE_TYPE_UNSPECIFIED = 0;
  TOPIC_MODULE_TYPE_CARD_GRID = 1;
  TOPIC_MODULE_TYPE_CARD_CAROUSEL = 2;
  TOPIC_MODULE_TYPE_EDITORIAL_LIST = 3;
  TOPIC_MODULE_TYPE_RANKING_EMBED = 4;
  TOPIC_MODULE_TYPE_CUSTOM_BANNER = 5;
}

enum RankingUpdateCadence {
  RANKING_UPDATE_CADENCE_UNSPECIFIED = 0;
  RANKING_UPDATE_CADENCE_REALTIME = 1;
  RANKING_UPDATE_CADENCE_DAILY = 2;
  RANKING_UPDATE_CADENCE_WEEKLY = 3;
  RANKING_UPDATE_CADENCE_MANUAL = 4;
}

enum GuideCardListSort {
  GUIDE_CARD_LIST_SORT_UNSPECIFIED = 0;
  GUIDE_CARD_LIST_SORT_NEWEST = 1;
  GUIDE_CARD_LIST_SORT_MANUAL_RANK = 2;
}

enum ContentResourceKind {
  CONTENT_RESOURCE_KIND_UNSPECIFIED = 0;
  CONTENT_RESOURCE_KIND_GUIDE_CARD = 1;
  CONTENT_RESOURCE_KIND_EDITORIAL_CONTENT = 2;
  CONTENT_RESOURCE_KIND_TOPIC = 3;
  CONTENT_RESOURCE_KIND_RANKING_LIST = 4;
}

// --- Common ---

message PaginationCursor {
  optional string next_cursor = 1;
  optional bool has_more = 2;
  optional int32 limit = 3;
}

message MediaRef {
  optional string media_id = 1;
  optional string url = 2;
  optional MediaType type = 3;
  optional int32 width = 4;
  optional int32 height = 5;
}

message AffiliateRef {
  optional string channel = 1;
  optional string external_item_id = 2;
  optional string external_shop_id = 3;
  map<string, string> payload = 4;
}

message Tag {
  optional string tag_id = 1;
  optional string name = 2;
  repeated string theme_ids = 3;
}

message BannerRef {
  optional string ref_type = 1;
  optional string ref_id = 2;
  optional string landing_url = 3;
}

message ThemeSummary {
  optional string theme_id = 1;
  optional string parent_id = 2;
  optional LifeTheme life_theme = 3;
  optional string slug = 4;
  optional string display_name = 5;
  optional string description = 6;
  optional string icon_url = 7;
  optional int32 sort_order = 8;
  optional ThemeStatus status = 9;
}

message GuideCard {
  optional string card_id = 1;
  optional GuideCardType type = 2;
  optional string title = 3;
  optional string subtitle = 4;
  optional MediaRef cover_media = 5;
  repeated MediaRef media_gallery = 6;
  repeated string selling_points = 7;
  optional string price_hint = 8;
  repeated string theme_ids = 9;
  repeated string tag_ids = 10;
  repeated AffiliateRef affiliate_refs = 11;
  optional bool commercial_disclosure_required = 12;
  optional ContentLifecycleStatus content_status = 13;
  optional int64 published_revision = 14;
  optional google.protobuf.Timestamp effective_from = 15;
  optional google.protobuf.Timestamp effective_to = 16;
  optional int64 revision = 17;
  optional google.protobuf.Timestamp created_at = 18;
  optional google.protobuf.Timestamp updated_at = 19;
  optional string created_by = 20;
  optional string updated_by = 21;
}

message GuideCardSummary {
  optional string card_id = 1;
  optional GuideCardType type = 2;
  optional string title = 3;
  optional string subtitle = 4;
  optional MediaRef cover_media = 5;
  repeated string theme_ids = 6;
  optional string price_hint = 7;
  optional ContentLifecycleStatus content_status = 8;
  optional bool commercial_disclosure_required = 9;
}

message EditorialBlock {
  optional string block_id = 1;
  optional EditorialBlockType type = 2;
  optional string text = 3;
  optional MediaRef media = 4;
  optional string card_id = 5;
}

message EditorialContent {
  optional string content_id = 1;
  optional string title = 2;
  optional string summary = 3;
  optional MediaRef cover = 4;
  optional string author_display_name = 5;
  repeated string theme_ids = 6;
  repeated string tag_ids = 7;
  repeated EditorialBlock blocks = 8;
  optional ContentLifecycleStatus content_status = 9;
  optional google.protobuf.Timestamp published_at = 10;
  optional int64 revision = 11;
  optional google.protobuf.Timestamp created_at = 12;
  optional google.protobuf.Timestamp updated_at = 13;
}

message EditorialContentListItem {
  optional string content_id = 1;
  optional string title = 2;
  optional string summary = 3;
  optional MediaRef cover = 4;
  optional google.protobuf.Timestamp published_at = 5;
}

message TopicModuleItem {
  optional string item_id = 1;
  optional string card_id = 2;
  optional string content_id = 3;
  optional string ranking_id = 4;
  optional string external_url = 5;
  optional string caption = 6;
  optional int32 sort_order = 7;
}

message TopicModule {
  optional string module_id = 1;
  optional TopicModuleType type = 2;
  optional string title = 3;
  optional int32 sort_order = 4;
  repeated TopicModuleItem items = 5;
}

message Topic {
  optional string topic_id = 1;
  optional string title = 2;
  optional string subtitle = 3;
  optional MediaRef banner = 4;
  repeated string theme_ids = 5;
  repeated TopicModule modules = 6;
  optional ContentLifecycleStatus content_status = 7;
  optional string seo_slug = 8;
  optional int64 revision = 9;
}

message TopicSummary {
  optional string topic_id = 1;
  optional string title = 2;
  optional string subtitle = 3;
  optional MediaRef banner = 4;
  repeated string theme_ids = 5;
  optional ContentLifecycleStatus content_status = 6;
}

message RankingEntry {
  optional string entry_id = 1;
  optional int32 rank = 2;
  optional string card_id = 3;
  optional string content_id = 4;
  optional string blurb = 5;
}

message RankingList {
  optional string ranking_id = 1;
  optional string title = 2;
  optional string subtitle = 3;
  optional MediaRef cover = 4;
  repeated string theme_ids = 5;
  optional string rule_summary = 6;
  optional RankingUpdateCadence update_cadence = 7;
  repeated RankingEntry entries = 8;
  optional ContentLifecycleStatus content_status = 9;
  optional int64 revision = 10;
}

message RankingListSummary {
  optional string ranking_id = 1;
  optional string title = 2;
  optional string subtitle = 3;
  optional MediaRef cover = 4;
}

// --- Requests / responses ---

message ListThemesRequest {
  optional string locale = 1;
  optional bool include_inactive = 2;
}

message ListThemesResponse {
  repeated ThemeSummary themes = 1;
  optional string etag = 2;
  optional int64 version = 3;
}

message GetThemeDetailRequest {
  optional string theme_id = 1;
}

message GetThemeDetailResponse {
  optional ThemeSummary theme = 1;
  repeated BannerRef banner_refs = 2;
}

message BatchGetGuideCardsRequest {
  repeated string card_ids = 1;
  optional google.protobuf.FieldMask field_mask = 2;
}

message BatchGetGuideCardsResponse {
  repeated GuideCard cards = 1;
  repeated string missing_ids = 2;
}

message ListGuideCardsRequest {
  optional string theme_id = 1;
  repeated string tag_ids = 2;
  optional GuideCardListSort sort = 3;
  optional string cursor = 4;
  optional int32 limit = 5;
}

message ListGuideCardsResponse {
  repeated GuideCardSummary cards = 1;
  optional PaginationCursor pagination = 2;
}

message GetEditorialContentRequest {
  optional string content_id = 1;
}

message GetEditorialContentResponse {
  optional EditorialContent content = 1;
  repeated string embedded_card_ids = 2;
}

message ListEditorialContentsRequest {
  optional string theme_id = 1;
  optional string collection_id = 2;
  optional string cursor = 3;
  optional int32 limit = 4;
}

message ListEditorialContentsResponse {
  repeated EditorialContentListItem items = 1;
  optional PaginationCursor pagination = 2;
}

message GetTopicRequest {
  optional string topic_id = 1;
}

message GetTopicResponse {
  optional Topic topic = 1;
}

message ListTopicsRequest {
  optional string theme_id = 1;
  optional ContentLifecycleStatus content_status = 2;
}

message ListTopicsResponse {
  repeated TopicSummary topics = 1;
}

message GetRankingListRequest {
  optional string ranking_id = 1;
}

message GetRankingListResponse {
  optional RankingList ranking = 1;
}

message ListRankingListsRequest {
  optional string theme_id = 1;
}

message ListRankingListsResponse {
  repeated RankingListSummary rankings = 1;
}

message UpsertGuideCardRequest {
  optional string client_request_id = 1;
  optional int64 expected_revision = 2;
  optional GuideCard guide_card = 3;
}

message UpsertGuideCardResponse {
  optional string card_id = 1;
  optional int64 revision = 2;
}

message UpsertEditorialContentRequest {
  optional string client_request_id = 1;
  optional int64 expected_revision = 2;
  optional EditorialContent content = 3;
}

message UpsertEditorialContentResponse {
  optional string content_id = 1;
  optional int64 revision = 2;
}

message UpsertTopicRequest {
  optional string client_request_id = 1;
  optional int64 expected_revision = 2;
  optional Topic topic = 3;
}

message UpsertTopicResponse {
  optional string topic_id = 1;
  optional int64 revision = 2;
}

message UpsertRankingListRequest {
  optional string client_request_id = 1;
  optional int64 expected_revision = 2;
  optional RankingList ranking = 3;
}

message UpsertRankingListResponse {
  optional string ranking_id = 1;
  optional int64 revision = 2;
}

message SubmitForReviewRequest {
  optional string client_request_id = 1;
  optional ContentResourceKind resource_kind = 2;
  optional string resource_id = 3;
  optional int64 revision = 4;
}

message SubmitForReviewResponse {
  optional ContentLifecycleStatus content_status = 1;
  optional string governance_queue_item_id = 2;
}

message PublishRevisionRequest {
  optional string client_request_id = 1;
  optional ContentResourceKind resource_kind = 2;
  optional string resource_id = 3;
  optional int64 revision = 4;
}

message PublishRevisionResponse {
  optional ContentLifecycleStatus content_status = 1;
  optional int64 published_revision = 2;
}

service ContentService {
  rpc ListThemes(ListThemesRequest) returns (ListThemesResponse);
  rpc GetThemeDetail(GetThemeDetailRequest) returns (GetThemeDetailResponse);
  rpc BatchGetGuideCards(BatchGetGuideCardsRequest) returns (BatchGetGuideCardsResponse);
  rpc ListGuideCards(ListGuideCardsRequest) returns (ListGuideCardsResponse);
  rpc GetEditorialContent(GetEditorialContentRequest) returns (GetEditorialContentResponse);
  rpc ListEditorialContents(ListEditorialContentsRequest) returns (ListEditorialContentsResponse);
  rpc GetTopic(GetTopicRequest) returns (GetTopicResponse);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc GetRankingList(GetRankingListRequest) returns (GetRankingListResponse);
  rpc ListRankingLists(ListRankingListsRequest) returns (ListRankingListsResponse);
  rpc UpsertGuideCard(UpsertGuideCardRequest) returns (UpsertGuideCardResponse);
  rpc UpsertEditorialContent(UpsertEditorialContentRequest) returns (UpsertEditorialContentResponse);
  rpc UpsertTopic(UpsertTopicRequest) returns (UpsertTopicResponse);
  rpc UpsertRankingList(UpsertRankingListRequest) returns (UpsertRankingListResponse);
  rpc SubmitForReview(SubmitForReviewRequest) returns (SubmitForReviewResponse);
  rpc PublishRevision(PublishRevisionRequest) returns (PublishRevisionResponse);
}

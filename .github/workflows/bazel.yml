name: Bazel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazelisk@v3
        with:
          bazelisk-version: "1.25.0"

      - name: Build all service targets
        run: bazel build //services/...

      - name: Contract smoke tests (shell)
        run: |
          bazel test \
            //services/gateway:gateway_pages_golden_contract_test \
            //services/gateway:gateway_user_golden_contract_test \
            //services/gateway:gateway_backoffice_contract_smoke_test \
            //services/platform/backoffice-backend:backoffice_backend_contract_smoke_test \
            //services/recommendation-server:recommendation_server_contract_smoke_test \
            //services/tracking-server:tracking_server_contract_smoke_test \
            //services/user-server:issue_token_pair_smoke_test \
            //services/user-server:pg_user_store_unit_test \
            --test_output=errors

apiVersion: v1
kind: Service
metadata:
  name: user-domain
  namespace: simple-living
  annotations:
    simple-living.io/internal-dns: "user-domain.simple-living.svc.cluster.local"
spec:
  type: ClusterIP
  selector:
    app: user-domain
  ports:
    - name: grpc
      protocol: TCP
      port: 9101
      targetPort: 9101

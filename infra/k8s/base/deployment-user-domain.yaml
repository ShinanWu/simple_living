apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-domain
  namespace: simple-living
  labels:
    app: user-domain
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: user-domain
  template:
    metadata:
      labels:
        app: user-domain
    spec:
      containers:
        - name: user-domain
          image: registry.example.com/simple-living/user-domain:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9101
              name: grpc
          envFrom:
            - configMapRef:
                name: common-env
            - secretRef:
                name: app-secrets
          readinessProbe:
            # Placeholder for gRPC health endpoint.
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Placeholder for gRPC health endpoint.
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
